# ==============================================================================
# SAM Rover (Smart Autonomous Mobile Rover) - Central Configuration
# ==============================================================================

system:
  name: "SAM"
  version: "2.4.0"
  # 'auto' detects if running on Raspberry Pi; if False/PC, runs simulated hardware
  mock_hardware: "auto"
  port: 8000
  host: "0.0.0.0"

# --- GPIO Pin Mapping (BCM Numbers) ---
# Note: These can be customized to match your exact physical wiring.
gpio:
  motors:
    left:
      ena: 17   # PWM speed control
      in1: 22   # Direction forward
      in2: 27   # Direction backward
    right:
      enb: 18   # PWM speed control
      in3: 23   # Direction forward
      in4: 24   # Direction backward
    pwm_frequency: 100
    min_duty_cycle: 10.0  # Deadband stiction compensation for 60 RPM gearboxes
    slew_rate_step: 12.0  # Max acceleration step per 15ms control tick (~180ms from 0 to 100%)
    steering_expo: 0.3    # Exponential steering curve (0.0 = linear, 0.3 = smooth center)
    invert_left: false    # Set to true if left motor spins opposite
    invert_right: false   # Set to true if right motor spins opposite

  ultrasonic:
    # 4-Directional HC-SR04 Sensors (Trigger, Echo)
    front:
      trigger: 10
      echo: 9
    rear:
      trigger: 11
      echo: 5
    left:
      trigger: 6
      echo: 13
    right:
      trigger: 19
      echo: 26

  leds:
    # 4 Directional Indicator LEDs
    front: 12
    rear: 16
    left: 20
    right: 21

  buzzer: 25  # Active piezo buzzer / horn pin (BCM)

  imu:
    # Reserved I2C bus pins (GPIO 2 = SDA, GPIO 3 = SCL)
    bus: 1
    addresses: [0x68, 0x69] # Auto-scanned
    filter_alpha: 0.96      # Complementary filter fusion factor (0.96 gyro / 0.04 gravity tilt)

# --- Safety & Control Parameters ---
safety:
  # If teleoperation packet is not received within this time (seconds), stop motors
  watchdog_timeout_sec: 0.50
  
  # Distance threshold in cm for obstacle avoidance
  obstacle_warning_cm: 35.0
  obstacle_critical_stop_cm: 15.0

  # Automatic GPIO release when web UI is inactive for this duration (seconds)
  idle_hardware_release_sec: 60.0

# --- Camera Configuration ---
camera:
  # Port auto-scan will check indices 0 through 4
  preferred_index: 0
  width: 640
  height: 480
  fps: 30
  jpeg_quality: 85

# --- Networking Configuration ---
network:
  ap_interface: "wlan0"
  ap_ssid: "SAM-Rover-Setup"
  ap_password: "raspberry"
  ap_ip: "192.168.4.1"
  external_interface: "wlan1"
  wifi_check_interval_sec: 15
